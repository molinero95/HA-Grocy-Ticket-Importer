name: "Grocy Ticket Importer"
version: "0.7.3"
slug: "ha_grocy_ticket_importer"
description: "Import receipts and manage Grocy stock via Home Assistant"
url: "https://github.com/molinero95/HA-Grocy-Ticket-Importer"
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:barcode-scan
panel_title: "Despensa"
panel_admin: true
map:
