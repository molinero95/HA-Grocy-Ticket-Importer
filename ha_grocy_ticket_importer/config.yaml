name: "Grocy Ticket Importer"
version: "1.15.0"
slug: "ha_grocy_ticket_importer"
description: "Import receipts and manage Grocy stock via Home Assistant"
url: "https://github.com/molinero95/HA-Grocy-Ticket-Importer"
init: false
arch:
  - aarch64
  - amd64
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:barcode-scan
panel_title: "Despensa"
panel_admin: true
map:
  - type: app_config
    read_only: false
    path: /config

ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Endpoint de Alexa (opcional; solo /alexa/despensa)"

options:
  alexa_skill_enabled: false
  alexa_skill_id: ""
  alexa_skill_user_id: ""
  grocy_url: "http://a0d7b954-grocy:80"
  grocy_location_id: 2
  shopping_sync_enabled: false
  shopping_sync_interval_seconds: 120
  alexa_shopping_list_entity: ""
  homeassistant_access_token: ""
schema:
  alexa_skill_enabled: "bool"
  alexa_skill_id: "str?"
  alexa_skill_user_id: "password?"
  grocy_url: "url"
  grocy_api_key: "password"
  openai_api_key: "password"
  grocy_location_id: "int(1,)"
  shopping_sync_enabled: "bool"
  shopping_sync_interval_seconds: "int(30,3600)"
  alexa_shopping_list_entity: "str?"
  homeassistant_access_token: "password?"
