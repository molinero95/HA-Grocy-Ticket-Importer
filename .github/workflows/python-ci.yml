name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GROCY_TEST_DIST: /tmp/despensa-grocy-4.7.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use npm 11 for TypeScript 7
        run: npm install --global npm@11
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Test React frontend with coverage
        run: npm run test:coverage
        working-directory: frontend
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ha_grocy_ticket_importer/frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Typecheck and build React frontend
        run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser smoke-test dependencies
        run: python -m pip install Flask python-dotenv websocket-client pillow pyOpenSSL==26.4.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: fileinfo, pdo_sqlite, gd, ctype, intl, mbstring
          coverage: none
      - name: Download and verify Grocy 4.7.1
        run: python tests/download_grocy.py "$GROCY_TEST_DIST"
      - name: Real Grocy API, import and restart contracts
        run: python tests/real_stack_server.py --check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Mobile and ingress browser smoke tests (disposable data only)
        run: npm run test:e2e
        working-directory: frontend
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ['3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web test dependencies
        run: python -m pip install Flask python-dotenv websocket-client pillow pyOpenSSL==26.4.0
      - name: Compile every Python file (catches syntax errors)
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(p for p in Path('.').rglob('*.py') if '.venv' not in p.parts and 'node_modules' not in p.parts)
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files')
          PY
      - name: Check retired legacy frontend is absent
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          source = Path('web.py').read_text()
          assert '<script>' not in source and 'PAGE =' not in source
          print('React is the single full frontend; basic fallback has no scripts')
          PYCODE
      - name: Check Home Assistant packaged sources are synchronized
        run: |
          for file in product_recognition.py alexa_endpoint.py alexa_verification.py shopping_aliases.py shopping_sync_status.py api_aliases.py extract.py importer.py barcode_stock.py product_images.py web.py generic_catalog.py variant_catalog.py catalog_audit.py shopping_match_queue.py shopping_sync_worker.py shopping_sync.py shopping_sync_adapters.py shopping_sync_runtime.py shopping_identity_sync.py shopping_identity_runtime.py shopping_sync_events.py api_photos.py stock_commands.py purchase_units.py catalog_lifecycle.py shopping_choice_conversion.py shopping_product_creation.py api_variants.py api_inventory.py api_shopping.py api_receipts.py receipt_review.py api_catalog.py duplicate_candidates.py duplicate_review.py stock_thresholds.py merge_audit.py; do
            cmp "$file" "ha_grocy_ticket_importer/$file"
          done
      - name: Build Home Assistant add-on container
        run: docker build --pull --tag despensa:migration --file ha_grocy_ticket_importer/Dockerfile ha_grocy_ticket_importer
      - name: Verify container entrypoint serves React without Grocy writes
        run: |
          docker run --detach --name despensa-smoke --publish 8768:8765 --env HA_INGRESS_MODE=1 --env WEB_SESSION_SECRET=disposable-container-test --entrypoint /venv/bin/gunicorn despensa:migration --chdir /app --bind 0.0.0.0:8765 web:app
          trap 'docker logs despensa-smoke; docker rm --force despensa-smoke' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 3 --fail http://127.0.0.1:8768/ --output /tmp/despensa-index.html
          python -c "from pathlib import Path; page=Path('/tmp/despensa-index.html').read_text(); assert 'id=\"root\"' in page and 'assets/' in page"
          docker exec despensa-smoke /venv/bin/python -c "from alexa_endpoint import app; client=app.test_client(); assert client.post('/alexa/despensa').status_code == 503; assert client.get('/api/v1/inventory').status_code == 404; assert client.get('/').status_code == 404"

      - name: Run unit tests without external API calls
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Package local Home Assistant app
        if: matrix.python-version == '3.13' && matrix.runner == 'ubuntu-24.04'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          app = Path("ha_grocy_ticket_importer")
          with ZipFile("ha-grocy-local-addon.zip", "w", ZIP_DEFLATED) as package:
              for path in sorted(app.rglob("*")):
                  if path.is_file() and not {"__pycache__", "node_modules", "dist", "test-results", "playwright-report", "coverage"}.intersection(path.parts):
                      package.write(path, path.as_posix())
          PY
      - name: Upload local installation package
        if: matrix.python-version == '3.13' && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ha-grocy-local-addon
          path: ha-grocy-local-addon.zip
          if-no-files-found: error
          retention-days: 14
