name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web test dependencies
        run: python -m pip install Flask python-dotenv
      - name: Compile every Python file (catches syntax errors)
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(p for p in Path('.').rglob('*.py') if '.venv' not in p.parts)
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files')
          PY
      - name: Check embedded browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          html_source = Path('web.py').read_text(encoding='utf-8')
          blocks = re.findall(r'<script>(.*?)</script>', html_source, re.DOTALL)
          if len(blocks) < 2:
              raise SystemExit('Expected barcode scanner and product search scripts')
          for script in blocks:
              with tempfile.NamedTemporaryFile(suffix='.js', mode='w', encoding='utf-8') as temp:
                  temp.write(script)
                  temp.flush()
                  subprocess.run(['node', '--check', temp.name], check=True)
          print(f'Validated {len(blocks)} JavaScript blocks')
          PY
      - name: Check Home Assistant packaged sources are synchronized
        run: |
          for file in extract.py importer.py barcode_stock.py product_images.py web.py generic_catalog.py variant_catalog.py catalog_audit.py; do
            cmp "$file" "ha_grocy_ticket_importer/$file"
          done
      - name: Build Home Assistant add-on container
        run: docker build --pull --file ha_grocy_ticket_importer/Dockerfile ha_grocy_ticket_importer
      - name: Run unit tests without external API calls
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Package local Home Assistant app
        if: matrix.python-version == '3.13'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          app = Path("ha_grocy_ticket_importer")
          with ZipFile("ha-grocy-local-addon.zip", "w", ZIP_DEFLATED) as package:
              for path in sorted(app.rglob("*")):
                  if path.is_file() and "__pycache__" not in path.parts:
                      package.write(path, path.as_posix())
          PY
      - name: Upload local installation package
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: ha-grocy-local-addon
          path: ha-grocy-local-addon.zip
          if-no-files-found: error
          retention-days: 14
